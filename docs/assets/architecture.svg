<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 210" width="920" height="210">
  <rect x="1" y="1" width="918" height="208" rx="16" fill="#ffffff" stroke="#d4dfee" stroke-width="1.5"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <!-- Step 1 -->
    <rect x="24" y="42" width="152" height="124" rx="12" fill="#f8faff" stroke="#b8d4ff"/>
    <text x="100" y="68" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#0066ff">01 // INPUT</text>
    <text x="100" y="94" text-anchor="middle" font-size="15" font-weight="700" fill="#162033">Sample Mix</text>
    <text x="100" y="118" text-anchor="middle" font-size="12" fill="#5c6f8a">6 smells · 37 mols</text>
    <text x="100" y="138" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#5c6f8a">data/samples.json</text>

    <!-- Arrow -->
    <line x1="180" y1="104" x2="206" y2="104" stroke="#0066ff" stroke-width="2"/>
    <polygon points="206,99 216,104 206,109" fill="#0066ff"/>

    <!-- Step 2 -->
    <rect x="218" y="42" width="152" height="124" rx="12" fill="#f8faff" stroke="#b8d4ff"/>
    <text x="294" y="68" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#0066ff">02 // SIMULATOR</text>
    <text x="294" y="94" text-anchor="middle" font-size="15" font-weight="700" fill="#162033">SensorBank</text>
    <text x="294" y="118" text-anchor="middle" font-size="12" fill="#5c6f8a">8 RDKit props -> S1..S8</text>
    <text x="294" y="138" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#5c6f8a">src/sensor.py</text>

    <line x1="374" y1="104" x2="400" y2="104" stroke="#0066ff" stroke-width="2"/>
    <polygon points="400,99 410,104 400,109" fill="#0066ff"/>

    <!-- Step 3 -->
    <rect x="412" y="42" width="152" height="124" rx="12" fill="#f8faff" stroke="#b8d4ff"/>
    <text x="488" y="68" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#0066ff">03 // CLASSIFIER</text>
    <text x="488" y="94" text-anchor="middle" font-size="15" font-weight="700" fill="#162033">Nose RF-200</text>
    <text x="488" y="118" text-anchor="middle" font-size="12" fill="#5c6f8a">96.7% held-out acc</text>
    <text x="488" y="138" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#5c6f8a">src/train_nose.py</text>

    <line x1="568" y1="104" x2="594" y2="104" stroke="#0066ff" stroke-width="2"/>
    <polygon points="594,99 604,104 594,109" fill="#0066ff"/>

    <!-- Step 4 -->
    <rect x="606" y="42" width="290" height="124" rx="12" fill="#eef5ff" stroke="#0066ff" stroke-width="1.5"/>
    <text x="751" y="68" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#0066ff">04 // SMELL MODEL + RANKING</text>
    <text x="751" y="94" text-anchor="middle" font-size="15" font-weight="700" fill="#162033">RF (0.832) or MPNN (0.874)</text>
    <text x="751" y="118" text-anchor="middle" font-size="12" fill="#5c6f8a">Predicted sample -> score * sqrt(lift)</text>
    <text x="751" y="138" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#5c6f8a">src/pipeline.py -> logs/sniffs.jsonl</text>
  </g>
</svg>
